<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abel's Survival">
<meta name="theme-color" content="#1a1d18">
<title>Abel's Survival</title>
<style>
:root{--ink:#ece6d4;--dim:#a39d8a;--blood:#c0362c;--xp:#e0b23e;--food:#c8913a;--water:#4a9ad0;--ok:#a6cf7e;--no:#e07068;--panel:#1b1e19}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1d18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hide{display:none!important}
/* HUD top-left: level badge + bars, like the real game */
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:calc(env(safe-area-inset-left) + 10px);display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:2}
#lvl{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:conic-gradient(var(--xp) 0deg,rgba(0,0,0,.55) 0deg);box-shadow:0 2px 6px rgba(0,0,0,.5);position:relative}
#lvl::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#23271f}
#lvl span{position:relative}
.bars{display:flex;flex-direction:column;gap:5px;padding-top:3px}
.bar{width:min(30vw,200px);height:14px;background:rgba(0,0,0,.55);border-radius:7px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
.bar span{position:absolute;left:8px;top:0;font-size:9.5px;line-height:13px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 2px #000}
#hpb i{background:linear-gradient(#e0574a,#a3291f)}
.mini{display:flex;gap:6px}
.mini .bar{width:calc(min(30vw,200px)/2 - 3px);height:11px}
#hub i{background:linear-gradient(#e0a54e,#a8702a)}
#thb i{background:linear-gradient(#6ab6e8,#2e74a8)}
.mini .bar span{font-size:8.5px;line-height:10px}
.bar.low{animation:blink 1s infinite}
@keyframes blink{50%{border-color:var(--blood)}}
#topr{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:8px;z-index:2}
.sq{width:48px;height:48px;border-radius:12px;background:rgba(24,27,22,.78);border:1px solid rgba(236,230,212,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sq small{font-size:8px;font-weight:800;letter-spacing:1px;margin-top:1px}
/* action buttons bottom-right */
#acts{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 16px);width:220px;height:200px;pointer-events:none;z-index:2}
.rb{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-weight:800;letter-spacing:1px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
#atk{width:104px;height:104px;right:0;bottom:0;background:radial-gradient(circle at 40% 35%,#6a2a24,#3a1612);border:3px solid rgba(236,140,120,.55)}
#atk b{font-size:34px;line-height:1}
#atk small{font-size:9px;margin-top:2px}
#use{width:76px;height:76px;right:116px;bottom:14px;background:rgba(24,27,22,.85);border:3px solid rgba(224,178,62,.75)}
#use b{font-size:24px;line-height:1}
#use small{font-size:9px;margin-top:2px}
#use .ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--xp) var(--p,0deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0)}
#run{width:58px;height:58px;right:24px;bottom:118px;background:rgba(24,27,22,.8);border:2px solid rgba(236,230,212,.3);font-size:10px}
.rb.on{filter:brightness(1.45)}
/* joystick */
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(236,230,212,.3);background:rgba(0,0,0,.18);pointer-events:none;z-index:2;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(236,230,212,.35)}
#buildbar{position:fixed;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:8px;background:rgba(14,16,12,.88);border:1px solid #3c4034;border-radius:10px;padding:8px;z-index:3;font-size:12px;max-width:70vw;flex-wrap:wrap;justify-content:flex-end}
#buildbar .pbtn{padding:12px 16px;font-size:13px}
#map{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 60%,#3e4430,#1e2218 75%);padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px)}
.mhead{display:flex;align-items:center;gap:12px}.mhead b{letter-spacing:3px;font-size:16px}.mhead .hint{flex:1}
.mbody{position:relative;flex:1;margin:6px 0;border-radius:12px;overflow:hidden;background:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.03) 0 2px,transparent 2px 22px),linear-gradient(160deg,#4a5236,#363c28);border:1px solid #5a5e44}
.mroads{position:absolute;inset:0;width:100%;height:100%}.mroads path{fill:none;stroke:rgba(200,180,130,.35);stroke-width:.6;stroke-dasharray:1.6 1.2}
.pin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pin i{font-style:normal;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1e2218;border:3px solid;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin span{font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;white-space:nowrap}
.pin.green i{border-color:#7ec850}.pin.yellow i{border-color:#e0b23e}.pin.red i{border-color:#d84a3a}.pin.home i{border-color:#ece6d4}
.pin.here i{box-shadow:0 0 0 4px rgba(236,230,212,.35)}.pin.sel i{transform:scale(1.2)}
.hordeline{position:absolute;transform:translate(-50%,-160%);color:#ff7a6a;font-weight:800;font-size:12px;animation:pulse 1.2s infinite}
.mcard{display:flex;align-items:center;gap:12px;background:rgba(14,16,12,.9);border:1px solid #3c4034;border-radius:10px;padding:10px 12px}.mcard>div{flex:1}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);width:min(420px,50vw);text-align:center;z-index:3;font-size:12px;letter-spacing:3px;text-shadow:0 1px 3px #000}
#bossbar div{height:12px;margin-top:3px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:6px;overflow:hidden}#bossbar i{display:block;height:100%;background:linear-gradient(#e0574a,#8a1f17)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 70px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:4}
.toast{background:rgba(14,16,12,.85);border:1px solid #3c4034;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;transition:opacity .3s}
.toast.xp{color:var(--xp)}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(16,18,14,.55),rgba(6,7,6,.94));z-index:6;padding:20px}
.screen h1{font-size:clamp(34px,8vw,64px);margin:0;letter-spacing:4px;text-shadow:0 3px 0 #3a1512,0 0 30px rgba(192,54,44,.35)}
.screen h2{font-size:clamp(28px,6vw,46px);margin:0;letter-spacing:6px;color:var(--blood)}
.screen p{color:var(--dim);margin:6px 0;font-size:14px}
.tbtns{display:flex;gap:12px;margin-top:16px}
.tbtn{background:rgba(34,38,30,.95);border:1px solid #6a6450;border-radius:10px;padding:12px 22px;font-weight:800;letter-spacing:2px;font-size:14px}
.tbtn.main{border-color:var(--blood);background:rgba(100,28,22,.7)}
.go{margin-top:16px;font-weight:800;letter-spacing:3px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
#rotate{z-index:9;display:none}
@media (orientation:portrait){#rotate{display:flex}}
#loading{z-index:8}
/* panels */
#panel{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px)}
.pcard{width:min(700px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid #3c4034;border-radius:12px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid #2e3229;font-weight:800;letter-spacing:2px;font-size:14px}
.phead button{background:none;border:0;font-size:20px}
#pbody{overflow-y:auto;padding:10px 12px;touch-action:pan-y}
.bagwrap{display:flex;gap:10px}
.equip{display:flex;flex-direction:column;gap:6px;width:62px;flex:none}
.equip label{font-size:9px;color:var(--dim);letter-spacing:1px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;flex:1}
.slot{aspect-ratio:1;background:#121410;border:1px solid #363a30;border-radius:7px;position:relative;font-size:22px;padding:0;min-width:0}
.slot.sel{border-color:var(--xp);box-shadow:0 0 0 1px var(--xp)}
.slot b{position:absolute;right:3px;bottom:2px;font-size:11px}
.slot i{position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:#363a30}
.slot i u{display:block;height:100%;background:#86ac58;border-radius:2px}
.detail{margin-top:10px;min-height:60px;border-top:1px solid #2e3229;padding-top:8px;display:flex;align-items:center;gap:12px}
.detail .txt{flex:1;font-size:13px}
.detail .txt div{color:var(--dim);margin-top:2px}
.pbtn{background:#2c3026;border:1px solid #4c5242;border-radius:7px;padding:8px 12px;font-weight:700;letter-spacing:1px;font-size:12px}
.pbtn.go2{border-color:#7e9e56;background:#313c26}
.pbtn:disabled{opacity:.35}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #262a22}
.row .ic{font-size:24px;width:34px;text-align:center}
.row .nm{flex:1;font-size:13px;font-weight:700}
.row .nm div{font-weight:400;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 6px;border-radius:4px;background:#262a22;font-weight:600}
.chip.no{color:var(--no)} .chip.ok{color:var(--ok)} .chip.lv{color:var(--xp)}
.hint{font-size:12px;color:var(--dim)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.4) 100%)}
#bui{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;gap:6px;padding:0 calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px);pointer-events:none}
#bui>*{pointer-events:auto}
#btop{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:3;background:rgba(14,16,12,.88);border:1px solid #3c4034;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;text-align:center;max-width:62vw}
.bcats{display:flex;gap:6px;align-items:center}
.bcat{padding:7px 12px;border-radius:8px;background:rgba(24,27,22,.88);border:1px solid #4c5242;font-weight:800;font-size:11px;letter-spacing:1px}
.bcat.on{border-color:var(--xp);color:var(--xp)}
.bpal{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x}
.bit{flex:none;width:78px;height:80px;border-radius:10px;background:rgba(18,20,16,.92);border:2px solid #3c4034;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;padding:2px}
.bit small{font-size:9.5px;font-weight:800;line-height:1.05;text-align:center}
.bit em{font-style:normal;font-size:8.5px;color:var(--ok);line-height:1.1;text-align:center}
.bit.on{border-color:var(--xp);box-shadow:0 0 0 1px var(--xp)}
.bit.lock{opacity:.5}
.bit.no em{color:var(--no)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>

<div id="hud" class="hide">
  <div id="lvl"><span id="lvln">1</span></div>
  <div class="bars">
    <div class="bar" id="hpb"><i></i><span>❤ <b id="hpt">100</b></span></div>
    <div class="mini">
      <div class="bar" id="hub"><i></i><span>🍖</span></div>
      <div class="bar" id="thb"><i></i><span>💧</span></div>
    </div>
  </div>
</div>
<div id="topr" class="hide">
  <button class="sq" id="bbag">🎒<small>BAG</small></button>
  <button class="sq" id="bcraft">🔨<small>CRAFT</small></button>
  <button class="sq" id="bbuild">🏠<small>BUILD</small></button>
  <button class="sq hide" id="bdebug">🐞<small>DEBUG</small></button>
  <button class="sq" id="bsound">🔊</button>
</div>
<div id="acts" class="hide">
  <div class="rb" id="run">RUN</div>
  <div class="rb hide" id="use"><div class="ring"></div><b id="useic">✋</b><small id="uselab">USE</small></div>
  <div class="rb" id="atk"><b id="atkic">✊</b><small>ATTACK</small></div>
</div>
<div id="btop" class="hide"></div>
<div id="bui" class="hide">
  <div class="bcats"><button class="bcat on" data-cat="struct">STRUCTURES</button><button class="bcat" data-cat="furn">FURNITURE</button><button class="bcat" data-cat="tools">TOOLS</button><span style="flex:1"></span><button class="pbtn" id="brot">↻ ROTATE</button><button class="pbtn go2" id="bplace">✔ BUILD</button><button class="pbtn" id="bdone">✕ EXIT</button></div>
  <div class="bpal scroll" id="bpal"></div>
</div>
<div id="joy" class="hide"><div id="knob"></div></div>
<div id="toasts"></div>

<div id="panel" class="hide"><div class="pcard"><div class="phead"><span id="ptitle"></span><button id="pclose">✕</button></div><div id="pbody" class="scroll"></div></div></div>

<div class="screen" id="title">
  <h1>ABEL'S SURVIVAL</h1>
  <p>No store. No energy bar. Just you and the dead.</p>
  <div class="tbtns"><button class="tbtn main hide" id="tcont">CONTINUE</button><button class="tbtn" id="tnew">NEW GAME</button></div>
  <p id="tsave"></p>
</div>
<div class="screen hide" id="dead">
  <h2>YOU DIED</h2>
  <p>Your backpack is where you fell. Get it back.</p>
  <div class="go">TAP TO WAKE UP AT THE COTTAGE</div>
</div>
<div class="screen" id="rotate"><h1 style="font-size:26px">ROTATE YOUR PHONE</h1><p>Abel's Survival plays sideways.</p></div>
<div class="screen hide" id="loading"><p>Loading…</p></div>

    if (Math.abs(z.x) > HALF - 2 || Math.abs(z.z) > HALF - 2) { z.tx = z.hx; z.tz = z.hz; }
    const look = z.ai === "chase" || z.ai === "notice" ? Math.atan2(P.x - z.x, P.z - z.z) : m > 0 ? Math.atan2(dx, dz) : z.face;

    if (P.alive && z.ai === "chase" && z.type !== "brute" && z.type !== "warden" && d < z.r + P.r + .35 && z.cd <= 0) { z.cd = 1.3; z.lunge = .25; hurtPlayer(T.dmg[0] + ri(0, T.dmg[1] - T.dmg[0])); }

    // animate: arms hang while idle, come up when it spots you

    const rg = z.rig; z.y += (onFloorY(z.x, z.z) - z.y) * .3; rg.g.position.set(z.x, z.y, z.z); rg.g.rotation.y = z.face;
    const sw = m > 0 ? .5 : 0;

    const arm = -.12 - z.raise * 1.15, wob = Math.sin(z.step * .5 + time * 1.3) * .1;
    rg.armL.rotation.x = arm + wob - (z.lunge > 0 ? .4 : 0); rg.armR.rotation.x = arm - .05 - wob - (z.lunge > 0 ? .4 : 0);
    rg.body.rotation.x = .1 + z.raise * .1;
    rg.body.rotation.z = m > 0 ? Math.sin(z.step * .5) * .08 : Math.sin(time * 1.1 + z.wa) * .05;
    rg.head.rotation.y = z.ai === "idle" ? Math.sin(time * .6 + z.wa) * .5 : 0;
    rg.head.rotation.z = z.ai === "idle" ? .15 : 0;
    rg.torso.material = z.flash > 0 ? mat(0xffffff) : rg.torsoMat || (rg.torsoMat = rg.torso.material);
    z.bar.visible = z.hp < z.max; z.fg.scale.x = Math.max(0.001, z.hp / z.max); z.fg.position.x = -.44 * (1 - z.hp / z.max);
    z.bar.quaternion.copy(camera.quaternion); z.bar.rotation.setFromQuaternion(camera.quaternion); z.bar.quaternion.premultiply(rg.g.quaternion.clone().invert());
  }
  zombies = zombies.filter((z) => !(z.dead < 0));
  for (const c of clouds) { c.t -= dt; c.m.scale.setScalar(1 + (3 - c.t) * .6); c.m.material.opacity = Math.max(0, c.t / 3 * .45); if (c.t > 1 && dist(c.x, c.z, P.x, P.z) < 2.6 && Math.floor(c.t * 2) !== Math.floor((c.t + dt) * 2)) hurtPlayer(6); if (c.t <= 0) { scene.remove(c.m); c.m.geometry.dispose(); } }

    if (f.light) { const k = 1 + Math.sin(time * 13 + f.x) * .12 + Math.sin(time * 7) * .08; f.light.intensity = 1.2 * k; const fl = f.g.getObjectByName("flame"), f2 = f.g.getObjectByName("flame2"); if (fl) fl.scale.set(1, k, 1); if (f2) f2.scale.set(1, 2 - k, 1); }
  }

  if (curZone === "home") for (const e of edges.values()) if (e.door) {
    const near = P.alive && dist(P.x, P.z, e.x, e.z) < 1.9;
    e.open = clamp(e.open + (near ? dt : -dt) * 4, 0, 1); e.door.rotation.y = -e.open * 1.65;

  if (Math.random() < dt * .3 && zombies.some((z) => z.chase)) sfx("groan");

  for (const p of parts) { p.t -= dt; p.vy -= 9 * dt; p.m.position.x += p.vx * dt; p.m.position.y = Math.max(.05, p.m.position.y + p.vy * dt); p.m.position.z += p.vz * dt; if (p.t <= 0) { scene.remove(p.m); p.m.geometry.dispose(); } }
  parts = parts.filter((p) => p.t > 0);

  if (state === "dying") { deadT -= dt; if (deadT <= .3) { state = "dead"; ui.dead.classList.remove("hide"); [ui.hud, ui.topr, ui.acts].forEach((e) => e.classList.add("hide")); } }
  else if (state === "dead" && deadT > 0) deadT -= dt;
  saveT -= dt; if (saveT <= 0 && state === "play") { saveT = 12; save(); }
}

// ================= render =================
let lastUse = "";
const fadeCache = new Map();
function fadeOf(m) { let f = fadeCache.get(m); if (!f) { f = m.clone(); f.transparent = true; f.opacity = .28; f.depthWrite = false; fadeCache.set(m, f); } return f; }

  for (const n of nodes) {
    if (n.kind !== "tree" || n.gone) continue;
    const dx = n.x - P.x, dz = n.z - P.z;
    const want = !buildMode && Math.abs(dx) < 2.6 && dz > -.6 && dz < 5.5;
    if (want === n.faded) continue;
    n.faded = want;
    n.g.children.forEach((c, i) => { if (i === 0) return; if (want) { c.userData.m = c.material; c.material = fadeOf(c.material); } else if (c.userData.m) c.material = c.userData.m; });
  }
}
const camLook = new THREE.Vector3(0, 0, -3), camOff = CAM_OFF.clone();
function render() {
  // player model
  const rg = playerRig;
  P.y = (P.y || 0) + (onFloorY(P.x, P.z) - (P.y || 0)) * .3;
  rg.g.position.set(P.x, P.y, P.z);
  rg.g.rotation.y += angDiff(P.face, rg.g.rotation.y) * .35;
  if (!P.alive) { rg.body.rotation.x = Math.max(-1.5, rg.body.rotation.x - .05); }
  else rg.body.rotation.x = 0;
  const w = Math.sin(P.walk);
  rg.legL.rotation.x = w * .7; rg.legR.rotation.x = -w * .7;
  rg.armL.rotation.x = -w * .5;
  if (P.swing > 0) { const k = 1 - P.swing / .35; rg.armR.rotation.x = -2.4 + k * 2.6; } else rg.armR.rotation.x = w * .5 - (P.weapon ? .3 : 0);
  rg.g.visible = !(P.inv > 0 && P.alive && Math.floor(time * 16) % 2 === 0 && P.inv < .5) || !P.alive;
  fadeTrees();
  if (flashlight.intensity > 0) { flashlight.position.set(P.x - Math.sin(P.face) * .5, 4.5, P.z - Math.cos(P.face) * .5); flashlight.target.position.set(P.x + Math.sin(P.face) * 7, 0, P.z + Math.cos(P.face) * 7); }
  for (const r of roofs) r.g.visible = !(Math.abs(P.x - r.x) < r.hw && Math.abs(P.z - r.z) < r.hd + .2);
  const pc = ckey(...cellOf(P.x, P.z));
  for (const r of baseRoofs) r.g.visible = !buildMode && !(curZone === "home" && r.set.has(pc));
  // camera follows from the high three-quarter angle (build mode swings it overhead)
  const tx = buildMode ? buildMode.cam.x : P.x, tz = buildMode ? buildMode.cam.z : P.z;
  camLook.x += (tx - camLook.x) * .12; camLook.z += (tz - camLook.z) * .12;
  camOff.lerp(buildMode ? BUILD_OFF : CAM_OFF, .1);
  camera.position.set(camLook.x + camOff.x, camOff.y, camLook.z + camOff.z);
  let lx = camLook.x, lz = camLook.z;
  if (shake > 0) { const sx = (R() - .5) * shake, sz = (R() - .5) * shake; camera.position.x += sx; camera.position.z += sz; lx += sx; lz += sz; }
  camera.lookAt(lx, 0, lz);
  sun.position.set(camLook.x + SUN_OFF.x, SUN_OFF.y, camLook.z + SUN_OFF.z);
  sun.target.position.set(camLook.x, 0, camLook.z);

  if (grave && grave.zone === curZone) { graveObj.visible = true; graveObj.position.set(grave.x, 0, grave.z); graveObj.children[1].material.opacity = .4 + Math.sin(time * 4) * .3; } else graveObj.visible = false;

// ================= loop =================
buildWorld(); attachBase(); stampHome();
camera.position.set(CAM_OFF.x, CAM_OFF.y, CAM_OFF.z - 3);
state = "title"; refreshTitle();

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { last = performance.now(); clearInput(); if (document.hidden) save(); });
window.addEventListener("pagehide", save);
window.ABEL3D = { get garage() { return garageFixed; }, get parts() { return partsHave; }, get pity() { return pity; }, travel, debugAction, get zone() { return curZone; }, get hordeActive() { return hordeActive; }, P, get bag() { return bag; }, get zombies() { return zombies; }, get animals() { return animals; }, get builds() { return furn; }, get furn() { return furn; }, floors, edges, get baseRoofs() { return baseRoofs; }, nodes, gain, gainXP, get state() { return state; }, get bench() { return furn.find((f) => f.t === "bench"); }, build: { enter: enterBuild, exit: exitBuild, sel: selectBuild, tool: selectTool, aim: buildAimWorld, place: doPlace, check: placeCheck, get mode() { return buildMode; } }, damageStruct, stampHome, onFloorY, nearStation, findUse, get toasts() { return toasts.map((t) => t.txt); } };
